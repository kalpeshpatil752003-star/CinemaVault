<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .logo-stroke { stroke: #00d4ff; }
        .logo-accent { stroke: #ffffff; }
        .logo-text { fill: #ffffff; }
        .logo-title { fill: #00d4ff; }
        .logo-tagline { fill: #ffffff; }
      }
      @media (prefers-color-scheme: light) {
        .logo-stroke { stroke: #0066cc; }
        .logo-accent { stroke: #333333; }
        .logo-text { fill: #333333; }
        .logo-title { fill: #0066cc; }
        .logo-tagline { fill: #666666; }
      }
    </style>
  </defs>
  
  <!-- Icon (left side) -->
  <g>
    <!-- Globe circle -->
    <circle cx="60" cy="60" r="35" fill="none" class="logo-stroke" stroke-width="2"/>
    
    <!-- Latitude lines -->
    <line x1="25" y1="50" x2="95" y2="50" class="logo-accent" stroke-width="0.8" opacity="0.7"/>
    <line x1="25" y1="60" x2="95" y2="60" class="logo-accent" stroke-width="1.2" opacity="0.8"/>
    <line x1="25" y1="70" x2="95" y2="70" class="logo-accent" stroke-width="0.8" opacity="0.7"/>
    
    <!-- Longitude lines (curved) -->
    <path d="M 60 25 Q 55 60 60 95" fill="none" class="logo-accent" stroke-width="0.8" opacity="0.7"/>
    <path d="M 60 25 Q 65 60 60 95" fill="none" class="logo-accent" stroke-width="0.8" opacity="0.7"/>
    
    <!-- Film frame (square around globe) -->
    <rect x="20" y="20" width="80" height="80" fill="none" class="logo-stroke" stroke-width="2" rx="2"/>
    
    <!-- Film frame corner marks -->
    <circle cx="20" cy="20" r="2.5" fill="none" class="logo-accent" stroke-width="1"/>
    <circle cx="100" cy="20" r="2.5" fill="none" class="logo-accent" stroke-width="1"/>
    <circle cx="20" cy="100" r="2.5" fill="none" class="logo-accent" stroke-width="1"/>
    <circle cx="100" cy="100" r="2.5" fill="none" class="logo-accent" stroke-width="1"/>
    
    <!-- Center dot -->
    <circle cx="60" cy="60" r="1.8" class="logo-title" opacity="0.7"/>
  </g>
  
  <!-- Text (right side) -->
  <g>
    <!-- Main text -->
    <text x="130" y="50" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" class="logo-title" letter-spacing="-0.5">CinemaVault</text>
    
    <!-- Tagline -->
    <text x="130" y="85" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" class="logo-tagline" opacity="0.8" letter-spacing="0.5">Explore Cinema Worldwide</text>
  </g>
</svg>